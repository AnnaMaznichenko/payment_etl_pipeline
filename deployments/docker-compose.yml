services:
  # Go приложение
  app:
    build:
      context: ..          # контекст - корень проекта
      dockerfile: deployments/Dockerfile  # путь к Dockerfile
    environment:
      CARDS_DSN: ${CARDS_DSN}
      WALLETS_DSN: ${WALLETS_DSN}
      CRYPTO_DSN: ${CRYPTO_DSN}
      META_DSN: ${META_DSN}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_PING_TIMEOUT: ${CLICKHOUSE_PING_TIMEOUT}
      MIGRATIONS_DIR: ${MIGRATIONS_DIR}
      PAGE_SIZE: ${PAGE_SIZE}
      BATCH_SIZE: ${BATCH_SIZE}
      TIMEOUT: ${TIMEOUT}
      POLL_INTERVAL: ${POLL_INTERVAL}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT}
    depends_on:
      postgres-cards:
        condition: service_healthy
      postgres-wallets:
        condition: service_healthy
      postgres-crypto:
        condition: service_healthy
      postgres-meta:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  # База для платежей по картам
  postgres-cards:
    image: postgres:15-alpine
    container_name: postgres-cards
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_CARDS_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-cards-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_CARDS_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

    # База для кошельков
  postgres-wallets:
    image: postgres:15-alpine
    container_name: postgres-wallets
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_WALLETS_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres-wallets-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_WALLETS_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # База для криптовалюты
  postgres-crypto:
    image: postgres:15-alpine
    container_name: postgres-crypto
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_CRYPTO_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres-crypto-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_CRYPTO_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # База для метаданных (чекпоинты)
  postgres-meta:
    image: postgres:15-alpine
    container_name: postgres-meta
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_META_DB}
    ports:
      - "5435:5432"
    volumes:
      - postgres-meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_META_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

   # ClickHouse
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "8123:8123"          # HTTP-интерфейс (для клиентов)
      - "9000:9000"          # нативный протокол (для драйвера Go)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER}", "--password", "${CLICKHOUSE_PASSWORD}", "--query", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-cards-data:
  postgres-wallets-data:
  postgres-crypto-data:
  postgres-meta-data:
  clickhouse-data: